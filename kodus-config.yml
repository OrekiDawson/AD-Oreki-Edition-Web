# Kodus/Kody PR review configuration. Requires enabling "kodus Config File Overrides Web Preferences"
# for EACH repository in Kodus UI; the file alone does not activate Kody.
# Default manual-only: respects project DeepSeek low-balance (< CNY 10) and peak-time stop rules.
version: 2.0
automatedReviewActive: false
reviewMode: balanced
reviewCadence:
  type: manual
runOnDraft: false
showStatusFeedback: true
pullRequestApprovalActive: false
isRequestChangesActive: false
enableCommittableSuggestions: false
repoInstructionsEnabled: true
kodyRulesGeneratorEnabled: false
reviewOptions:
  bug: true
  security: true
  performance: true
  business_logic: true
suggestionControl:
  severityLevelFilter: medium
  applyFiltersToKodyRules: false
summary:
  generatePRSummary: false
ignorePaths:
  - "**/*.apk"
  - "**/*.aab"
  - "**/*.xapk"
  - "**/*.dex"
  - "**/*.jar"
  - "**/*.zip"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.webp"
  - "**/*.gif"
  - "**/*.pdf"
  - "reports/**"
  - "evidence/**"
  - "**/node_modules/**"
  - "**/build/**"
  - "**/dist/**"
