name: Web CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Decide whether PR changes require browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_browser: ${{ steps.paths.outputs.run_browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Keep full validation on main and any non-document changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_browser=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
            run_browser=false
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|reports/*|AGENTS.md|PROJECT_PAUSED.md|WEB_ANDROID_DIFFERENCES.md|README.md|CHANGELOG.md|LICENSE|MOD-LICENSE|NOTICE.md)
                  ;;
                *)
                  run_browser=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          fi
          echo "run_browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "::notice::Mobile Chromium required: $run_browser (main always tests)"

  logic:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Enforce active repository rule entrypoints
        run: |
          test -s AGENTS.md
          test -s docs/DELIVERY_RULES.md
          test -s .github/pull_request_template.md
          grep -Fq 'DELIVERY_RULES.md' AGENTS.md
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/game.js
          node --check serve.mjs
      - name: Targeted game-rule checks
        run: |
          node scripts/check_stage_gate.mjs
          node scripts/check_eternity_gate.mjs
          node scripts/test-r100-newgame-autobuyers.mjs
          node scripts/test-scheduler-beat.mjs
          # R104 real fresh-save failures: scheduler starvation, clock throttling,
          # breakthrough/reset priority and ID1 reserve. Keep these in fast CI.
          node scripts/test-r91-early-beat-share.mjs
          node scripts/test-r88-executor-clock.mjs
          node scripts/test-r90-early-routine-beat.mjs
          node scripts/test-r87-break-id1-reserve.mjs
          # R107-01 P1 stage-capped beat: effectiveInterval = min(user config, stage cap)
          node scripts/test-stage-beat-cap.mjs
      - name: Protect exact Web production deploy source
        run: node scripts/check_deploy_workflow.mjs
      # Source JSON, generated tutorial, and player-visible terminology are
      # release-critical. The latest real CI already passed all 2189 checks.
      - name: Enforce tutorial source, generated module and wording contract
        run: node scripts/validate_tutorial.mjs

      - name: Test incremental repository policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_repository_policy.py' -v
      - name: Ensure DeepSeek AI review and failure triage remain disabled
        run: python3 -m unittest discover -s scripts/tests -p 'test_no_deepseek_ci.py' -v
      - name: Verify DeepSeek off-peak billing calendar and time boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_deepseek_pricing.py' -v
      - name: Test Pages pre-push integrity policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_pages_staging.py' -v
      - name: Reject new sensitive assets, credentials and CRLF
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::notice::NOT RUN: manual dispatch has no trusted comparison base"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] || {
            echo "::error::Missing trustworthy base SHA for repository policy"
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA"
          python3 scripts/check_repository_policy.py --base "$BASE_SHA" --policy web

  browser:
    name: Mobile Chromium smoke
    needs: classify
    if: needs.classify.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # Cache only the exact Chromium revision used by the lockfile-pinned runner.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json') }}-1.65.0-v1
      - name: Cache npm download artifacts
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json') }}-1.65.0-v1
      - name: Cache pinned Playwright test modules
        id: playwright-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: web-playwright-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('package-lock.json') }}-v1
      - name: Install lockfile-pinned Playwright test runner
        run: npm ci --ignore-scripts
      - name: Reject stale or incorrect cached Playwright modules
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('node_modules/@playwright/test/package.json','utf8')); if(p.version!=='1.65.0') process.exit(1)"
      # install --with-deps remains idempotent; on a cache hit no browser download.
      # System libraries are still installed on each fresh GitHub-hosted runner.
      - name: Ensure Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Real browser smoke test
        run: npx playwright test --config=.github/playwright.config.mjs
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
