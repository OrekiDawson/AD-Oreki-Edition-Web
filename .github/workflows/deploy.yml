name: 申请已批准的 Web Pages 部署

'on':
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact immutable main commit SHA approved for production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: oreki-web-production-request
  cancel-in-progress: false

jobs:
  gate:
    name: 复用精确源码 commit 的成功 Web CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - name: 验证选定的 main SHA 与实际检出内容
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: 对照源码检查已批准 SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$APPROVED_SHA" && "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::FAIL：选定源码版本与当前 main SHA 不一致"
            exit 1
          }
      - name: 要求 Node.js 与移动端 Chromium CI 均成功
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100")"
          ci_run="$(echo "$runs" | jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | first | .id // empty')"
          [[ "$ci_run" =~ ^[0-9]+$ ]] || { echo "::error::FAIL：找不到精确 SHA 对应的成功 Push CI"; exit 1; }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100")"
          echo "$jobs" | jq -e '[.jobs[] | select(.name=="Node checks" and .conclusion=="success")] | length == 1' >/dev/null
          echo "$jobs" | jq -e '[.jobs[] | select(.name=="Mobile Chromium smoke" and .conclusion=="success")] | length == 1' >/dev/null
          echo "ci_run_id=$ci_run" >> "$GITHUB_OUTPUT"
          echo "::notice::Reusing CI $ci_run for Web $GITHUB_SHA; no duplicate Playwright run"

  dispatch:
    name: 将不可变 Web 源码发送至官方 Pages Artifact 工作流
    needs: gate
    runs-on: ubuntu-latest
    environment: web-production
    timeout-minutes: 10
    steps:
      - name: 检查 Pages Actions 权限范围
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          test -n "$PAGES_DEPLOY_TOKEN" || {
            echo "::error::BLOCKED：请在 web-production 环境设置 Pages Actions:write 凭据"
            exit 1
          }
      - name: 触发已验证 Web commit，不使用浮动分支
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" == "$GITHUB_SHA" ]] || exit 1
          gh api -X POST "repos/OrekiDawson/OrekiDawson.github.io/actions/workflows/deploy-approved-web.yml/dispatches" \
            -f ref=main \
            -f "inputs[approved_sha]=$APPROVED_SHA" \
            -f "inputs[web_ci_run_id]=$CI_RUN"
          echo "::notice::PASS：已为 Web SHA $APPROVED_SHA / CI $CI_RUN 请求 Pages 部署"
          echo "::notice::NOT RUN：本工作流仅发起请求，官方 Pages 工作流仍需独立通过"
